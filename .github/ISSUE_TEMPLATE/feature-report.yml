name: Feature request
description: Guidance the skill should cover and does not.
title: "[Request]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: >-
        Use this for a gap: something the skill should tell you and currently does not.


        If you are not sure what the fix should be yet, and you want to talk it through first,
        start in [Ideas](../../discussions/categories/ideas). Requests that arrive already tested
        against a live build are the ones that get in fastest.


        Keep this request work-safe regardless of your build's rating. Describe the mechanic, not
        the content.
  - type: dropdown
    id: kind
    attributes:
      label: What kind of addition
      options:
        - New guidance for something not covered
        - A new entry in the failure modes catalogue
        - Coverage for a Tipsy feature the skill does not know about
        - A new reference file
        - Packaging or distribution
        - Other
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - Character
        - World (Studio)
        - Both
        - Neither, this is about the skill itself
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Where the skill left you
      description: What you were building, what you needed to know, and what you had to work out on your own.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you want it to say
      description: Draft the guidance if you can. Concrete instructions beat a description of the topic.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Have you tested this
      description: >-
        Did you run it in a live build, and what changed? This skill is built out of observed
        behavior rather than theory, so a tested fix carries far more weight than a plausible one.
        Say so plainly if it is untested.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: This request is work-safe.
          required: true
